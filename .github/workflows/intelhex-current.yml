name: Fork-only Intel Hex current source qualification
on:
  push:
    branches: [validation/intelhex-current-20261016]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/intelhex-current-gate.py /tmp/intelhex-current-gate.py
      - run: git fetch origin b9d67d3473d1a8771cc92777c6eb4e5cee183dfc 71b6849b8cdb00da7cc5630db6867b936061a230 && git checkout --detach b9d67d3473d1a8771cc92777c6eb4e5cee183dfc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Qualify actual editor export and sparse addresses with unchanged record tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/intelhex-export-evidence
          HEAD_SHA: b9d67d3473d1a8771cc92777c6eb4e5cee183dfc
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/intelhex-current-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intelhex-current
          path: ${{ runner.temp }}/intelhex-export-evidence/
          retention-days: 14
