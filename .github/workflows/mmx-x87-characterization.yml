name: Fork-only MMX x87 FNSAVE characterization
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/mmx-x87-characterization.py /tmp/mmx-x87-characterization.py
      - run: git fetch origin 820590aadcc7d8885bebca708c57db82494ceeb5 && git checkout --detach 820590aadcc7d8885bebca708c57db82494ceeb5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Characterize actual MMX register state through FNSAVE
        env:
          HEAD_SHA: 820590aadcc7d8885bebca708c57db82494ceeb5
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/mmx-x87-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mmx-x87-characterization
          path: native-evidence/
          retention-days: 14
