name: Fork-only public ARM parameter storage boundary characterization
on:
  push:
    branches: [validation/arm-parameter-capacity-characterization-corrective-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/arm-parameter-capacity-characterization.py /tmp/arm-parameter-capacity-characterization.py
      - run: git fetch origin 4e8e386bb5803366c2591b6e8364ca28b812fef1 && git checkout --detach 4e8e386bb5803366c2591b6e8364ca28b812fef1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual ARM vararg scalar storage on unchanged production
        env:
          HEAD_SHA: 4e8e386bb5803366c2591b6e8364ca28b812fef1
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/arm-parameter-capacity-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm-parameter-capacity-characterization
          path: native-evidence/
          retention-days: 14
