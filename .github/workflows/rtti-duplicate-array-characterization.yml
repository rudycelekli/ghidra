name: Fork-only public RTTI duplicate array characterization
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Preserve fork-only characterization before unchanged-base checkout
        run: |
          cp .github/rtti-duplicate-array-characterization.py /tmp/rtti-duplicate-array-characterization.py
          cp .github/RttiDuplicateArrayCharacterization.java /tmp/RttiDuplicateArrayCharacterization.java
          git fetch origin 918d44ebc2962a53d23eeee52b8f44c7816e7815
          git checkout --detach 918d44ebc2962a53d23eeee52b8f44c7816e7815
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual public PE import and original RTTI recovery script
        env:
          GHIDRA_HEADLESS_MAXMEM: 4G
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/rtti-duplicate-array-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rtti-duplicate-array-characterization
          path: native-evidence/
          retention-days: 14
