name: Fork-only original-file relocation characterization
on:
  push:
    branches: [validation/original-file-relocation-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/original-file-relocation-characterization.py /tmp/original-file-relocation-characterization.py
      - run: git fetch origin 2a8f2b1e9f873fb3a577a751f7d52c75cb641220 && git checkout --detach 2a8f2b1e9f873fb3a577a751f7d52c75cb641220
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Characterize actual inert-byte original-file export and unchanged backing-byte tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/original-file-relocation-evidence
          HEAD_SHA: 2a8f2b1e9f873fb3a577a751f7d52c75cb641220
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/original-file-relocation-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-file-relocation-characterization
          path: ${{ runner.temp }}/original-file-relocation-evidence/
          retention-days: 14
