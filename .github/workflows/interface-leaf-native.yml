name: Fork-only public console leaf arguments native qualification
on:
  push:
    branches: [validation/console-state-native-build-cleanup-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/interface-leaf-native-gate.py /tmp/interface-leaf-native-gate.py
      - run: git fetch origin 93b05fdafe181d51d665cda32cd6f1807f62cce5 && git checkout --detach 93b05fdafe181d51d665cda32cd6f1807f62cce5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native standalone console prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils-dev
      - name: Native original and fixed parser and public roundtrips with full build
        env:
          HEAD_SHA: 93b05fdafe181d51d665cda32cd6f1807f62cce5
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/interface-leaf-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interface-leaf-native
          path: native-evidence/
          retention-days: 14
