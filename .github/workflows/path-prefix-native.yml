name: Bundle path persistence native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/path-prefix-native-gate.py /tmp/path-prefix-native-gate.py
      - run: git fetch origin 2aa2b240fde914e3cd159a2a6e1e075b568813c8 && git checkout --detach 2aa2b240fde914e3cd159a2a6e1e075b568813c8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
        env:
          KIND: path-prefix
          HEAD_SHA: 2aa2b240fde914e3cd159a2a6e1e075b568813c8
          CONFIG: '{"language": "java", "production": "Ghidra/Framework/Generic/src/main/java/generic/util/Path.java", "test_task": ":Base:integrationTest", "test_classes": ["ghidra.app.plugin.core.script.BundlePathPersistenceTest"], "class_counts": {"ghidra.app.plugin.core.script.BundlePathPersistenceTest": 3}, "result_dir": "Ghidra/Features/Base/build/test-results/integrationTest", "total": 3, "failures": [["ghidra.app.plugin.core.script.BundlePathPersistenceTest", "testInstallationSiblingBundlePathSurvivesSaveRestore"]]}'
        run: python /tmp/path-prefix-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-path-prefix
          path: native-evidence/
          retention-days: 14
