name: Fork-only BSim user info native qualification
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/bsim-empty-password-native-gate.py /tmp/bsim-empty-password-native-gate.py
      - run: git fetch origin 9648c5f2bb7f1e6d7c21cb4ceaeef611fa39b3c5 && git checkout --detach 9648c5f2bb7f1e6d7c21cb4ceaeef611fa39b3c5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual baseline and fixed regressions with full build
