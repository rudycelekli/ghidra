name: Combined cache native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/combined-cache-native-gate.py /tmp/combined-cache-native-gate.py
      - run: git fetch origin 2936b27529ec21d6237eaa0e586a158596c97e55 && git checkout --detach 2936b27529ec21d6237eaa0e586a158596c97e55
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native regressions and full build
        env:
          KIND: combined-cache
          HEAD_SHA: 2936b27529ec21d6237eaa0e586a158596c97e55
          CONFIG: '{"language": "java", "productions": ["Ghidra/Framework/Generic/src/main/java/ghidra/util/datastruct/ObjectCache.java", "Ghidra/Framework/Generic/src/main/java/ghidra/util/datastruct/AbstractWeakValueMap.java"], "test_task": ":Generic:test", "test_classes": ["ghidra.util.datastruct.ObjectCacheTest", "ghidra.util.datastruct.WeakValueMapQueueTest"], "class_counts": {"ghidra.util.datastruct.ObjectCacheTest": 4, "ghidra.util.datastruct.WeakValueMapQueueTest": 4}, "result_dir": "Ghidra/Framework/Generic/build/test-results/test", "total": 8, "failures": [["ghidra.util.datastruct.ObjectCacheTest", "testLateCollectedReferencePreservesReplacement"], ["ghidra.util.datastruct.ObjectCacheTest", "testLateCollectedReferenceDoesNotReloadReplacement"], ["ghidra.util.datastruct.WeakValueMapQueueTest", "testDelayedCollectionPreservesReplacement"], ["ghidra.util.datastruct.WeakValueMapQueueTest", "testSeveralCollectedGenerationsPreserveCurrentValue"]]}'
        run: python /tmp/combined-cache-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-combined-cache
          path: native-evidence/
          retention-days: 14
