name: Fork-only bounded open enum editor mutation characterization
on:
  push:
    branches: [validation/enum-open-editor-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/enum-open-editor-mutation-characterization.py /tmp/enum-open-editor-mutation-characterization.py
      - run: git fetch origin 0a27d7ce23dabb4ac88d96a325b5bf9f3270a9b1 && git checkout --detach 0a27d7ce23dabb4ac88d96a325b5bf9f3270a9b1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual editor and script transactions in an isolated headed fixture
        env:
          HEAD_SHA: 0a27d7ce23dabb4ac88d96a325b5bf9f3270a9b1
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/enum-open-editor-mutation-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enum-open-editor-mutation-characterization
          path: native-evidence/
          retention-days: 14
