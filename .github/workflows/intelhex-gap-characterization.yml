name: Fork-only actual Intel HEX export address gap characterization
on:
  push:
    branches: [validation/intelhex-address-gap-characterization-20261012]
permissions:
  contents: read
jobs:
  actual-exporter:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/intelhex-gap-characterization.py /tmp/intelhex-gap-characterization.py
      - run: git fetch origin 06822da6b05e9ca350fc700b619b4d53dd5f9cd6 918d44ebc2962a53d23eeee52b8f44c7816e7815 && git checkout --detach 06822da6b05e9ca350fc700b619b4d53dd5f9cd6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Characterize real public export and actual record address-byte map
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/intelhex-gap-evidence
          HEAD_SHA: 06822da6b05e9ca350fc700b619b4d53dd5f9cd6
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/intelhex-gap-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intelhex-address-gap-characterization
          path: ${{ runner.temp }}/intelhex-gap-evidence/
          retention-days: 14
