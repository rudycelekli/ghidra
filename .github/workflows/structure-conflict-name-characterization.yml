name: Fork-only public structure editor characterization
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/structure-conflict-name-characterization.py /tmp/structure-conflict-name-characterization.py
      - run: git fetch origin 8e366b88a4a19db630b40e4a5e94223ad79656a6 && git checkout --detach 8e366b88a4a19db630b40e4a5e94223ad79656a6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Characterize actual public structure drop
        env:
          HEAD_SHA: 8e366b88a4a19db630b40e4a5e94223ad79656a6
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/structure-conflict-name-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: structure-conflict-name-characterization
          path: native-evidence/
          retention-days: 14
