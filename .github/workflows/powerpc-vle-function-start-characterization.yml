name: Fork-only PowerPC VLE function-start characterization
on:
  push:
    branches: [validation/powerpc-vle-function-start-external-evidence-20261012]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Preserve immutable fork-only gate before unchanged-base checkout
        run: |
          cp .github/powerpc-vle-function-start-characterization.py /tmp/powerpc-vle-function-start-characterization.py
          cp .github/PowerPcVleFunctionStartCharacterization.java /tmp/PowerPcVleFunctionStartCharacterization.java
          git fetch origin 918d44ebc2962a53d23eeee52b8f44c7816e7815
          git checkout --detach 918d44ebc2962a53d23eeee52b8f44c7816e7815
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual decoder and configured public function-start analyzer
        env:
          GHIDRA_HEADLESS_MAXMEM: 4G
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/powerpc-vle-function-start-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: powerpc-vle-function-start-characterization
          path: /tmp/powerpc-vle-native-evidence/
          retention-days: 14
