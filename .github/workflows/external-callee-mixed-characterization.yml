name: Fork-only external callee mixed namespace experiment
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/external-callee-mixed-characterization-gate.py /tmp/external-callee-mixed-characterization-gate.py
      - run: git fetch origin 072657a31999b51bbd25acf6cef5208371fe3882 && git checkout --detach 072657a31999b51bbd25acf6cef5208371fe3882
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Actual native dual decompiler action investigation
        env:
          HEAD_SHA: 072657a31999b51bbd25acf6cef5208371fe3882
        run: python /tmp/external-callee-mixed-characterization-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-callee-mixed-characterization
          path: native-evidence/
          retention-days: 14
