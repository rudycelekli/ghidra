name: Indirect XRef access type native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/xref-indirect-native-gate.py /tmp/xref-indirect-native-gate.py
      - run: git fetch origin 66762a52707b28a001ae841a0a9ed6ce771c7625 && git checkout --detach 66762a52707b28a001ae841a0a9ed6ce771c7625
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
        env:
          KIND: xref-indirect
          HEAD_SHA: 66762a52707b28a001ae841a0a9ed6ce771c7625
          CONFIG: '{"language": "java", "production": "Ghidra/Features/Base/src/main/java/ghidra/app/util/viewer/field/XRefFieldFactory.java", "test_task": ":Base:integrationTest", "test_classes": ["ghidra.app.util.viewer.field.XRefIndirectTypeTest"], "class_counts": {"ghidra.app.util.viewer.field.XRefIndirectTypeTest": 8}, "result_dir": "Ghidra/Features/Base/build/test-results/integrationTest", "total": 8, "failures": [["ghidra.app.util.viewer.field.XRefIndirectTypeTest", "testIndirectWriteUsesWriteTextAndColor"], ["ghidra.app.util.viewer.field.XRefIndirectTypeTest", "testIndirectDataUsesDataTextAndColor"]]}'
        run: python /tmp/xref-indirect-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-xref-indirect
          path: native-evidence/
          retention-days: 14
