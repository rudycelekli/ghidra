name: Source transform edit selection validation native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/source-transform-action-native-gate.py /tmp/source-transform-action-native-gate.py
      - run: git fetch origin d68529bfe3c61d4055c203a4e2059f6ed4b093d7 && git checkout --detach d68529bfe3c61d4055c203a4e2059f6ed4b093d7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
        env:
          KIND: source-transform-action
          HEAD_SHA: d68529bfe3c61d4055c203a4e2059f6ed4b093d7
          CONFIG: '{"language": "java", "production": "Ghidra/Features/Base/src/main/java/ghidra/app/plugin/core/sourcefilestable/SourceFilesTableProvider.java", "test_task": ":Base:integrationTest", "test_classes": ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest"], "class_counts": {"ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest": 4}, "result_dir": "Ghidra/Features/Base/build/test-results/integrationTest", "total": 4, "failures": [["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testEmptyTransformTableCannotEdit"], ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testClearedTransformSelectionCannotEdit"], ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testMultipleTransformsCannotEdit"]], "expected_cases": [["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testEmptyTransformTableCannotEdit"], ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testClearedTransformSelectionCannotEdit"], ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testMultipleTransformsCannotEdit"], ["ghidra.app.plugin.core.sourcefilestable.SourceTransformActionTest", "testSingleTransformOpensEditor"]]}'
        run: python /tmp/source-transform-action-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-source-transform-action
          path: native-evidence/
          retention-days: 14
