name: Bookmark explicit empty filter native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/bookmark-empty-filter-native-gate.py /tmp/bookmark-empty-filter-native-gate.py
      - run: git fetch origin 42bd1cbada65faa64f790fdeeb82ed7c3b462130 && git checkout --detach 42bd1cbada65faa64f790fdeeb82ed7c3b462130
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
