          HEAD_SHA: 42bd1cbada65faa64f790fdeeb82ed7c3b462130
          CONFIG: '{"language": "java", "productions": ["Ghidra/Features/Base/src/main/java/ghidra/app/plugin/core/bookmark/BookmarkTableModel.java", "Ghidra/Features/Base/src/main/java/ghidra/app/plugin/core/bookmark/BookmarkProvider.java", "Ghidra/Features/Base/src/main/java/ghidra/app/plugin/core/bookmark/FilterState.java"], "test_task": ":Base:integrationTest", "test_classes": ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "ghidra.app.plugin.core.bookmark.BookmarkPluginTest"], "class_counts": {"ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest": 8, "ghidra.app.plugin.core.bookmark.BookmarkPluginTest": 19}, "result_dir": "Ghidra/Features/Base/build/test-results/integrationTest", "total": 27, "failures": [["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllIsAnAppliedFilter"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesAddedType"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesXmlStateRoundTrip"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesTransientStateAndReload"]], "expected_cases": [["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllIsAnAppliedFilter"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesAddedType"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesXmlStateRoundTrip"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testHideAllSurvivesTransientStateAndReload"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testAbsentStateKeepsDefaultTypes"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testNonemptySelectionSurvivesXmlStateRoundTrip"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testNewTypeRemainsDisabledForNonemptyFilter"], ["ghidra.app.plugin.core.bookmark.BookmarkEmptyFilterTest", "testMissingSelectedTypeKeepsExistingFallback"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testFiltering"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testFilteringByText"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testFilterPersistence"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testFilterPersistenceWithMissingType"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testSelectionGoto"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testSelectionMakeSelection"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testSelectionDelete"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testEditCategory"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testEditComment"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testAddBookmark"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testDeleteBookmarkAction"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testDeleteBookmarkUpdatesTable"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testMultipleDelete"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testSetNoteOverDiscontiguosSelection"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testMarkerAdded"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testDeleteOffcutBookmarks"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testIteratorFromAddress"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testIteratorFromAddress_Backwards"], ["ghidra.app.plugin.core.bookmark.BookmarkPluginTest", "testRemoveBookmarksByType"]]}'
