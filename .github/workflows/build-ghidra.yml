name: Next native contribution validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: plugin
            head: dd99a351a436aef1826bac4b3a26dd9b6ee2f305
            config: '{"language": "python", "production": "Ghidra/Features/PyGhidra/src/main/py/src/pyghidra/launcher.py", "test_path": "Ghidra/Features/PyGhidra/src/main/py/tests/test_plugin.py", "pattern": "failed_script_copy_preserves_installation_ownership", "total": 2, "failures": ["test_failed_script_copy_preserves_installation_ownership[False]"]}'
          - kind: stream
            head: 3e09040fd601326b05dd339df6b9b67ca6d7a7aa
            config: '{"language": "java", "production": "Ghidra/Features/Base/src/main/java/ghidra/app/util/bin/ByteProviderInputStream.java", "test_task": ":Base:test", "test_class": "ghidra.app.util.bin.ByteProviderInputStreamTest", "result_dir": "Ghidra/Features/Base/build/test-results/test", "total": 9, "failures": ["testZeroLengthReadAtEnd", "testZeroLengthReadFromEmptyProvider", "testSkipDoesNotOverflow", "testReadBoundsCheckedAtEnd", "testReadBoundsCheckedBeforeLengthClipping", "testNullBufferCheckedAtEnd"]}'
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/next-native-gate.py /tmp/next-native-gate.py
      - run: git fetch origin ${{ matrix.head }} && git checkout --detach ${{ matrix.head }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native regressions and full build
        env:
          KIND: ${{ matrix.kind }}
          HEAD_SHA: ${{ matrix.head }}
          CONFIG: ${{ matrix.config }}
        run: python /tmp/next-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-${{ matrix.kind }}
          path: native-evidence/
          retention-days: 14
