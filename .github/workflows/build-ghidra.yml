name: Native contribution validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: script
            head: 0c0f2b4ef6179012e8e26fee0153af232b2e9225
          - kind: analysis
            head: 4d99efa5dead2b9bb8ea5a6f89c5fb9c51a89882
    steps:
      - uses: actions/checkout@v6
      - name: Preserve validation runner
        run: cp .github/hosted-native-gate.py /tmp/hosted-native-gate.py
      - name: Checkout exact candidate
        run: git fetch origin ${{ matrix.head }} && git checkout --detach ${{ matrix.head }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native baseline, fixed, regression, and full build
        env:
          CANDIDATE_KIND: ${{ matrix.kind }}
          CANDIDATE_HEAD: ${{ matrix.head }}
        run: python /tmp/hosted-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.kind }}
          path: native-evidence/
          retention-days: 14
