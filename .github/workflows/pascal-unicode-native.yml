name: Pascal Unicode encoding native validation
on:
  push:
    branches: [validation/pascal-unicode-native-20261011]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/pascal-unicode-native-gate.py /tmp/pascal-unicode-native-gate.py
      - run: git fetch origin 7bb115e2e064439c94212759d8c9eeaf1fe88f49 && git checkout --detach 7bb115e2e064439c94212759d8c9eeaf1fe88f49
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native baseline, fixed regressions and full build
        env:
          KIND: pascal-unicode
          HEAD_SHA: 7bb115e2e064439c94212759d8c9eeaf1fe88f49
          CONFIG: '{"language": "java", "production": "Ghidra/Framework/SoftwareModeling/src/main/java/ghidra/program/model/data/StringDataInstance.java", "test_task": ":SoftwareModeling:test", "test_classes": ["ghidra.program.model.data.PascalUnicodeEncodingTest"], "class_counts": {"ghidra.program.model.data.PascalUnicodeEncodingTest": 6}, "total": 6, "result_dir": "Ghidra/Framework/SoftwareModeling/build/test-results/test", "failures": [["ghidra.program.model.data.PascalUnicodeEncodingTest", "testAsciiHeaderCountsUtf16Units"], ["ghidra.program.model.data.PascalUnicodeEncodingTest", "testBmpHeaderCountsUtf16Units"], ["ghidra.program.model.data.PascalUnicodeEncodingTest", "testSupplementaryHeaderCountsTwoUtf16Units"]]}'
        run: python /tmp/pascal-unicode-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-pascal-unicode
          path: native-evidence/
          retention-days: 14
