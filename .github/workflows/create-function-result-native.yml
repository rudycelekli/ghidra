name: Fork-only CreateFunction result contract native qualification
on:
  push:
    branches: [validation/create-function-result-contract-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/create-function-result-native-gate.py /tmp/create-function-result-native-gate.py
      - run: git fetch origin 6fd57458dd612823a86bfee9e223b901a6fa5598 && git checkout --detach 6fd57458dd612823a86bfee9e223b901a6fa5598
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual baseline and fixed regressions, unchanged original suites and full build
        env:
          HEAD_SHA: 6fd57458dd612823a86bfee9e223b901a6fa5598
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/create-function-result-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: create-function-result-native
          path: native-evidence/
          retention-days: 14
