name: Signed enum editor value allocation native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/enum-editor-signed-allocation-native-gate.py /tmp/enum-editor-signed-allocation-native-gate.py
      - run: git fetch origin f0b93564f70b1df7349b3e1f060cef7fe521416d && git checkout --detach f0b93564f70b1df7349b3e1f060cef7fe521416d
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
        env:
          KIND: enum-editor-signed-allocation
          HEAD_SHA: f0b93564f70b1df7349b3e1f060cef7fe521416d
