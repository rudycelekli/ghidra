name: Sleigh inherited with context native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/with-context-native-gate.py /tmp/with-context-native-gate.py
      - run: git fetch origin 36eff5d0afc3a2a16205f7693868d4ab144f9757 && git checkout --detach 36eff5d0afc3a2a16205f7693868d4ab144f9757
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native regressions and full build
        env:
          KIND: with-context
          HEAD_SHA: 36eff5d0afc3a2a16205f7693868d4ab144f9757
          CONFIG: '{"language": "java", "production": "Ghidra/Framework/SoftwareModeling/src/main/java/ghidra/pcodeCPort/slgh_compile/SleighCompile.java", "test_task": ":SoftwareModeling:test", "test_classes": ["ghidra.app.plugin.processors.sleigh.SleighWithContextTest"], "class_counts": {"ghidra.app.plugin.processors.sleigh.SleighWithContextTest": 4}, "result_dir": "Ghidra/Framework/SoftwareModeling/build/test-results/test", "total": 4, "failures": [["ghidra.app.plugin.processors.sleigh.SleighWithContextTest", "testWithActionsWithoutConstructorActions"], ["ghidra.app.plugin.processors.sleigh.SleighWithContextTest", "testNestedWithActionsWithoutConstructorActions"]]}'
        run: python /tmp/with-context-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-with-context
          path: native-evidence/
          retention-days: 14
