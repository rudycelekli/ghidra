name: Listing comment clipboard blank lines native validation
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/comment-clipboard-native-gate.py /tmp/comment-clipboard-native-gate.py
      - run: git fetch origin cc84a924d3376b7320f0c4527eba1d32b2d28f02 && git checkout --detach cc84a924d3376b7320f0c4527eba1d32b2d28f02
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Native regressions and full build
        env:
          KIND: comment-clipboard
          HEAD_SHA: cc84a924d3376b7320f0c4527eba1d32b2d28f02
          CONFIG: '{"language": "java", "production": "Ghidra/Features/Base/src/main/java/ghidra/app/plugin/core/clipboard/CodeBrowserClipboardProvider.java", "test_task": ":Base:integrationTest", "test_classes": ["ghidra.app.plugin.core.clipboard.CommentClipboardBlankLinesTest"], "class_counts": {"ghidra.app.plugin.core.clipboard.CommentClipboardBlankLinesTest": 6}, "result_dir": "Ghidra/Features/Base/build/test-results/integrationTest", "total": 6, "failures": [["ghidra.app.plugin.core.clipboard.CommentClipboardBlankLinesTest", "testLeadingBlankLine"], ["ghidra.app.plugin.core.clipboard.CommentClipboardBlankLinesTest", "testMultipleLeadingBlankLines"], ["ghidra.app.plugin.core.clipboard.CommentClipboardBlankLinesTest", "testAllBlankLines"]]}'
        run: python /tmp/comment-clipboard-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-comment-clipboard
          path: native-evidence/
          retention-days: 14
