name: Fork-only public CreateFunction command result characterization
on:
  push:
    branches: [validation/create-function-result-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/create-function-result-characterization.py /tmp/create-function-result-characterization.py
      - run: git fetch origin f139558d36194d81d0a9578351cc9c843ef8b507 && git checkout --detach f139558d36194d81d0a9578351cc9c843ef8b507
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual public command return and effects on unchanged production
        env:
          HEAD_SHA: f139558d36194d81d0a9578351cc9c843ef8b507
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/create-function-result-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: create-function-result-characterization
          path: native-evidence/
          retention-days: 14
