name: External symbol library path native validation
on:
  push:
    branches: [validation/symbolpath-external-library-native-20261011]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/symbolpath-library-native-gate.py /tmp/symbolpath-library-native-gate.py
      - run: git fetch origin f576f5b2532548e9681e16363eba46d9e5752012 && git checkout --detach f576f5b2532548e9681e16363eba46d9e5752012
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native baseline, fixed regressions and full build
        env:
          KIND: symbolpath-library
          HEAD_SHA: f576f5b2532548e9681e16363eba46d9e5752012
          CONFIG: '{"language": "java", "production": "Ghidra/Framework/SoftwareModeling/src/main/java/ghidra/app/util/SymbolPath.java", "test_task": ":SoftwareModeling:test", "test_classes": ["ghidra.app.util.SymbolPathExternalLibraryTest", "ghidra.app.util.SymbolPathTest"], "class_counts": {"ghidra.app.util.SymbolPathExternalLibraryTest": 6, "ghidra.app.util.SymbolPathTest": 9}, "result_dir": "Ghidra/Framework/SoftwareModeling/build/test-results/test", "total": 15, "failures": [["ghidra.app.util.SymbolPathExternalLibraryTest", "testNestedExternalSymbolExcludesLibrary"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testDeepExternalSymbolExcludesLibrary"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testExcludedPathFindsCorrespondingSymbolInExternalProgram"]], "expected_cases": [["ghidra.app.util.SymbolPathExternalLibraryTest", "testNestedExternalSymbolExcludesLibrary"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testDeepExternalSymbolExcludesLibrary"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testExcludedPathFindsCorrespondingSymbolInExternalProgram"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testLibraryRetainedWhenExclusionDisabled"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testDirectExternalSymbolExcludesLibraryControl"], ["ghidra.app.util.SymbolPathExternalLibraryTest", "testGlobalSymbolUnaffectedControl"], ["ghidra.app.util.SymbolPathTest", "testJustSymbolNameNoPath"], ["ghidra.app.util.SymbolPathTest", "testSymbolPathGivenPathString"], ["ghidra.app.util.SymbolPathTest", "testArrayConstructorNoData"], ["ghidra.app.util.SymbolPathTest", "testArrayContructorOneString"], ["ghidra.app.util.SymbolPathTest", "testArrayContructorTwoString"], ["ghidra.app.util.SymbolPathTest", "testArrayContructorMultipleString"], ["ghidra.app.util.SymbolPathTest", "testToArray"], ["ghidra.app.util.SymbolPathTest", "testToList"], ["ghidra.app.util.SymbolPathTest", "testCompareTo"]]}'
        run: python /tmp/symbolpath-library-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-symbolpath-library
          path: native-evidence/
          retention-days: 14
