name: Fork-only standalone console save characterization
on:
  push:
    branches: [validation/console-save-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/console-save-characterization.py /tmp/console-save-characterization.py
      - run: git fetch origin 918d44ebc2962a53d23eeee52b8f44c7816e7815 && git checkout --detach 918d44ebc2962a53d23eeee52b8f44c7816e7815
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native standalone console prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils-dev
      - name: Actual ELF load, decompile and save characterization
        env:
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/console-save-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-save-characterization
          path: native-evidence/
          retention-days: 14
