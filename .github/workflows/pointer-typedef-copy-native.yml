name: Pointer typedef target manager native validation
on:
  push:
    branches: [validation/pointer-typedef-copy-manager-native-20261011]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/pointer-typedef-copy-native-gate.py /tmp/pointer-typedef-copy-native-gate.py
      - run: git fetch origin 52829decfa5b716e8e84fe47449eff6175921be2 && git checkout --detach 52829decfa5b716e8e84fe47449eff6175921be2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native baseline, fixed regressions and full build
        env:
          KIND: pointer-typedef-copy
          HEAD_SHA: 52829decfa5b716e8e84fe47449eff6175921be2
          CONFIG: '{"language": "java", "production": "Ghidra/Framework/SoftwareModeling/src/main/java/ghidra/program/model/data/PointerTypedef.java", "test_task": ":Base:test", "test_classes": ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest"], "class_counts": {"ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest": 6}, "result_dir": "Ghidra/Features/Base/build/test-results/test", "total": 6, "failures": [["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testDynamicCopyUsesTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testDynamicCloneUsesTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testFixedWidthCopyKeepsSettingsInTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testNamedTypeUtilityCopiesToTargetManager"]], "expected_cases": [["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testDynamicCopyUsesTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testDynamicCloneUsesTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testFixedWidthCopyKeepsSettingsInTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testNamedTypeUtilityCopiesToTargetManager"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testCloneInSameManagerKeepsIdentity"], ["ghidra.app.plugin.core.datamgr.util.PointerTypedefCopyTest", "testCopyInSameManagerCreatesDistinctType"]]}'
        run: python /tmp/pointer-typedef-copy-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: next-native-pointer-typedef-copy
          path: native-evidence/
          retention-days: 14
