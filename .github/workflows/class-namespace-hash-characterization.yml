name: Fork-only class namespace hash characterization
on:
  push:
    branches: [validation/class-namespace-hash-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/class-namespace-hash-evidence
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/class-namespace-hash-characterization.py /tmp/class-namespace-hash-characterization.py
      - run: git fetch origin ff15abff784b5b79a057ef494c1cb6683d5ea6d9 && git checkout --detach ff15abff784b5b79a057ef494c1cb6683d5ea6d9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Characterize real public class namespace collections and unchanged namespace tests
        env:
          HEAD_SHA: ff15abff784b5b79a057ef494c1cb6683d5ea6d9
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/class-namespace-hash-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: class-namespace-hash-characterization
          path: ${{ runner.temp }}/class-namespace-hash-evidence/
          retention-days: 14
