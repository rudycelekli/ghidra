name: MMX destination x87 high bits native qualification
on:
  push:
    branches: [validation/mmx-x87-state-native-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/mmx-x87-state-native-gate.py /tmp/mmx-x87-state-native-gate.py
      - run: git fetch origin a433d24ea90eaf38759d217d9b1f0cc92959b1b9 && git checkout --detach a433d24ea90eaf38759d217d9b1f0cc92959b1b9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual x86 compiler, baseline, fixed and full build
        env:
          KIND: mmx-x87-state
          HEAD_SHA: a433d24ea90eaf38759d217d9b1f0cc92959b1b9
          CONFIG: '{"language": "java", "production": "Ghidra/Processors/x86/data/languages/ia.sinc", "test_task": ":Base:test", "test_classes": ["ghidra.app.emulator.MmxX87StateTest", "ghidra.pcode.emu.PlainPcodeEmulatorTest"], "class_counts": {"ghidra.app.emulator.MmxX87StateTest": 16, "ghidra.pcode.emu.PlainPcodeEmulatorTest": 9}, "result_dir": "Ghidra/Features/Base/build/test-results/test", "total": 25, "failures": [["ghidra.app.emulator.MmxX87StateTest", "testPxorFirstRegister"], ["ghidra.app.emulator.MmxX87StateTest", "testPxorLastRegister"], ["ghidra.app.emulator.MmxX87StateTest", "testMovdRegisterTransfer"], ["ghidra.app.emulator.MmxX87StateTest", "testPackedByteArithmetic"], ["ghidra.app.emulator.MmxX87StateTest", "testReversedMovqDestination"], ["ghidra.app.emulator.MmxX87StateTest", "testSignedMaximumConditionalWrite"], ["ghidra.app.emulator.MmxX87StateTest", "testUnsignedMaximumConditionalWrite"], ["ghidra.app.emulator.MmxX87StateTest", "testSignedMinimumUnchangedLowBits"], ["ghidra.app.emulator.MmxX87StateTest", "testUnsignedMinimumUnchangedLowBits"], ["ghidra.app.emulator.MmxX87StateTest", "testEveryRegisterDestinationMapping"], ["ghidra.app.emulator.MmxX87StateTest", "testEveryReversedDestinationMapping"], ["ghidra.app.emulator.MmxX87StateTest", "testMemorySourceWrite"]], "expected_cases": [["ghidra.app.emulator.MmxX87StateTest", "testPxorFirstRegister"], ["ghidra.app.emulator.MmxX87StateTest", "testPxorLastRegister"], ["ghidra.app.emulator.MmxX87StateTest", "testMovdRegisterTransfer"], ["ghidra.app.emulator.MmxX87StateTest", "testPackedByteArithmetic"], ["ghidra.app.emulator.MmxX87StateTest", "testReversedMovqDestination"], ["ghidra.app.emulator.MmxX87StateTest", "testMovqMemoryReadControl"], ["ghidra.app.emulator.MmxX87StateTest", "testEmmsControl"], ["ghidra.app.emulator.MmxX87StateTest", "testSignedMaximumConditionalWrite"], ["ghidra.app.emulator.MmxX87StateTest", "testUnsignedMaximumConditionalWrite"], ["ghidra.app.emulator.MmxX87StateTest", "testSignedMinimumUnchangedLowBits"], ["ghidra.app.emulator.MmxX87StateTest", "testUnsignedMinimumUnchangedLowBits"], ["ghidra.app.emulator.MmxX87StateTest", "testEveryRegisterDestinationMapping"], ["ghidra.app.emulator.MmxX87StateTest", "testEveryReversedDestinationMapping"], ["ghidra.app.emulator.MmxX87StateTest", "testMemorySourceWrite"], ["ghidra.app.emulator.MmxX87StateTest", "testMovdReadControl"], ["ghidra.app.emulator.MmxX87StateTest", "testMaskReadControl"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testRunFibonacciIterativeToy"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testRunFibonacciIterativeX64"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testRunFibonacciRecursiveX64"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testSwi"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testInjectionError"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testSkipThumbStaysThumb"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testInjectedBranch"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testInjectedIndirectBranch"], ["ghidra.pcode.emu.PlainPcodeEmulatorTest", "testArmPltIntoThumbFunction"]]}'
        run: python /tmp/mmx-x87-state-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-mmx-x87-state
          path: native-evidence/
          retention-days: 14
