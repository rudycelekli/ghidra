name: Fork-only RTTI label producer and consumer characterization
on:
  push:
    branches: [validation/rtti-type-info-label-characterization-20261012]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/ghidra'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/rtti-type-info-label-characterization.py /tmp/rtti-type-info-label-characterization.py && cp .github/rtti-type-info-label-original-manifest.json /tmp/rtti-type-info-label-original-manifest.json
      - run: git fetch origin 97cafa158f52427a6fd94c77b6dfa20a06721d32 && git checkout --detach 97cafa158f52427a6fd94c77b6dfa20a06721d32
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Characterize actual Windows LABEL producers and unchanged RTTI tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/rtti-type-info-label-evidence
          ORIGINAL_MANIFEST: /tmp/rtti-type-info-label-original-manifest.json
          HEAD_SHA: 97cafa158f52427a6fd94c77b6dfa20a06721d32
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/rtti-type-info-label-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rtti-type-info-label-characterization
          path: ${{ runner.temp }}/rtti-type-info-label-evidence/
          retention-days: 14
