name: Fork-only ARM explicit allocation native qualification
on:
  push:
    branches: [validation/arm-explicit-allocation-native-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - run: |
          cp .github/arm-explicit-allocation-native-gate.py /tmp/arm-explicit-allocation-native-gate.py
          cp .github/arm-explicit-allocation-native-config.json /tmp/arm-explicit-allocation-native-config.json
      - run: git fetch origin d1aab6f214b0d5af7b369829f7fa784c61d67fc9 && git checkout --detach d1aab6f214b0d5af7b369829f7fa784c61d67fc9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb bison flex
      - name: Actual baseline and fixed allocation, overrides and complete regression controls
        env:
          HEAD_SHA: d1aab6f214b0d5af7b369829f7fa784c61d67fc9
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
          CONFIG_FILE: /tmp/arm-explicit-allocation-native-config.json
        run: python /tmp/arm-explicit-allocation-native-gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm-explicit-allocation-native
          path: native-evidence/
          retention-days: 14
