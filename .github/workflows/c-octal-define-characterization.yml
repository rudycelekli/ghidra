name: Fork-only C octal define characterization
on: [push]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/c-octal-define-characterization.py /tmp/c-octal-define-characterization.py
      - run: git fetch origin cba7b5fb80887035387d897448e31d5bcd63d8e8 && git checkout --detach cba7b5fb80887035387d897448e31d5bcd63d8e8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Characterize actual compound C macro values
        env:
          HEAD_SHA: cba7b5fb80887035387d897448e31d5bcd63d8e8
          BASE_SHA: 918d44ebc2962a53d23eeee52b8f44c7816e7815
        run: python /tmp/c-octal-define-characterization.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c-octal-define-characterization
          path: native-evidence/
          retention-days: 14
